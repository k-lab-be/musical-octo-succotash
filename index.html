<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DST Training</title>
<meta name="theme-color" content="#111416">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DST">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Ontwerp: donker grijs met een blauw accent. Grote afgeronde kaarten, capsule-dagen, zwevende navigatiebalk, grote cijfers.
   Alles wat je aan kleur, lettertype en vorm wil aanpassen staat in deze tokens. */
:root{
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#111416; --surface:#1A1E21; --surface-2:#23282C; --surface-3:#2E343A; --line:#2E343A;
  --ink:#EAF0F3; --ink-2:#A7B4BC; --ink-3:#7E8D96;
  --blue:#00638E; --blue-2:#8CB9CC; --blue-deep:#00334A; --ice:#BFD8E3; --ice-ink:#0E2A38;
  --good:#7FC8A9; --good-bg:#17302A; --warn:#D9B26F; --warn-bg:#352D1A; --bad:#E39090; --bad-bg:#382325;
  --gutter:24px; --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px; --gap:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;margin:0;padding:0 0 120px;
  background-image:radial-gradient(120% 40% at 50% -5%,rgba(0,99,142,.30),transparent 70%);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{width:100%;max-width:768px;margin:0 auto;padding:0}
#head,#app{display:block;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.ver{padding:24px;text-align:center;font-size:.75rem;color:var(--ink-3)}
body{overflow-x:clip}
.wrap *{min-width:0}
input,select,textarea,img,svg{max-width:100%}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.5rem;line-height:1.1}
h3{font-size:1.1875rem;line-height:1.2}
p{margin:0}
a{color:var(--blue-2)}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:22px 0 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.weeknav{display:flex;align-items:center;gap:8px}
.circ{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;font-size:1.4rem;line-height:1}
.circ:disabled{opacity:.35}
.meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:.8125rem;color:var(--ink-2)}
.meta-row input[type=date]{width:auto;min-height:34px;padding:2px 10px;border-radius:99px;font-size:.8125rem}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2);font-weight:600}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.wait i{background:var(--warn)}
.sync.off i{background:var(--bad)}
.link{background:none;border:0;color:var(--blue-2);padding:4px;text-decoration:underline;font-size:.8125rem;white-space:nowrap}
input[type=text],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 14px;background:var(--surface-3);border:1px solid transparent;border-radius:var(--r-sm)}
input[type=text]:focus,textarea:focus,select:focus,input[type=date]:focus{border-color:var(--blue-2);outline:none}
textarea{min-height:84px;resize:vertical}
select{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
label.lbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.btn{min-height:48px;padding:10px 20px;border-radius:99px;border:0;background:var(--surface-3);font-weight:700}
.btn.primary{background:var(--blue);color:#fff}
.btn.good{background:var(--good-bg);color:var(--good)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.sel-good{background:var(--good);color:#0C2A20}
.btn.sel-bad{background:var(--bad);color:#2E1010}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.875rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
section.view{padding-top:6px;display:flex;flex-direction:column;gap:var(--gap)}
.card{background:var(--surface);border-radius:var(--r-xl);padding:18px}
.tag{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--surface-3);color:var(--ink-2)}
.tag.dts{background:rgba(140,185,204,.16);color:var(--blue-2)}
.tag.key{background:var(--warn-bg);color:var(--warn)}
.tag.opt{background:transparent;box-shadow:inset 0 0 0 1px var(--surface-3)}
.chip{display:inline-block;font-size:.8125rem;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface-3);color:var(--ink-2)}
.chip.done{background:var(--good-bg);color:var(--good)}
.chip.skipped{background:var(--bad-bg);color:var(--bad)}
.chip.dropped{background:var(--surface-2);color:var(--ink-3)}
.hero{border-radius:var(--r-xl);padding:20px;background:linear-gradient(150deg,#00638E 0%,#004A6B 60%,#00334A 100%);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;overflow:hidden}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero .big{font-size:3.25rem;line-height:.95;font-weight:800;letter-spacing:-.03em}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .chip{background:rgba(255,255,255,.16);color:#fff}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#fff}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.0625rem;font-weight:800}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;border:0;background:var(--surface);border-radius:99px;min-height:84px;color:var(--ink)}
.dchip span:first-child{font-size:.6875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.dchip b{font-size:1.25rem;line-height:1;font-weight:800}
.dchip.sel{background:var(--blue);color:#fff}
.dchip.sel span:first-child{color:rgba(255,255,255,.8)}
.dchip.now:not(.sel){box-shadow:inset 0 0 0 1.5px var(--blue)}
.dchip.off{opacity:.5}
.dots{display:flex;gap:3px;min-height:8px}
.dot{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.dot.done{background:var(--good);box-shadow:none}
.dot.skipped{background:var(--bad);box-shadow:none}
.dot.dropped{background:var(--ink-3);box-shadow:none}
.dchip.sel .dot{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8)}
.dchip.sel .dot.done,.dchip.sel .dot.skipped,.dchip.sel .dot.dropped{background:#fff;box-shadow:none}
.sess-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sess-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.info{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);color:#F5E3BD;font-size:.9375rem}
.ex{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:grid;gap:8px;background:var(--surface-2);border-radius:var(--r-md);padding:12px}
.exname{display:flex;flex-direction:column;gap:2px}
.exname b{font-weight:700}
.target{color:var(--ink-2);font-size:.875rem}
.ex input{background:var(--surface-3)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin-top:16px}
.meta .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1 1 130px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r-lg);background:var(--warn-bg);color:#F5E3BD}
.msg{background:var(--surface);border-radius:var(--r-xl);padding:18px;box-shadow:inset 0 0 0 1.5px var(--blue)}
.msg h3{margin-bottom:6px}
.msg p{color:var(--ink-2);white-space:pre-wrap}
.msg .src{margin-top:8px;font-size:.875rem}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:var(--gap)}
.tile{border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:112px;background:var(--surface)}
.tile .big{font-size:2.25rem;line-height:1;font-weight:800;letter-spacing:-.02em}
.tile p{font-size:.8125rem;font-weight:600}
.tile.blue{background:var(--blue);color:#fff}.tile.blue p{color:rgba(255,255,255,.8)}
.tile.ice{background:var(--ice);color:var(--ice-ink)}.tile.ice p{color:#2F5568}
.dayrow{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.srow{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;padding:12px;background:var(--surface-2);border-radius:var(--r-md)}
.srow .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.srow .t b{font-weight:700;overflow-wrap:anywhere}
.srow select{width:auto;min-height:38px;padding:4px 28px 4px 12px;font-size:.875rem;border-radius:99px}
.chipbtn{border:0;background:none;padding:0;min-height:38px}
.prop{display:grid;gap:10px;padding:12px;margin-top:8px;background:var(--surface-2);border-radius:var(--r-md)}
.check{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--ink-2)}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--ink-2);font-size:16px;font-family:var(--font)}
.chart .grid{stroke:var(--surface-3);stroke-width:1}
.chart .line{fill:none;stroke:var(--blue-2);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:url(#wg)}
.chart .pt{fill:var(--blue-2);stroke:var(--surface);stroke-width:3}
.chart .pt.hot{fill:#fff;stroke:var(--blue);stroke-width:4}
.tip{min-height:1.4em;font-size:.9375rem;color:var(--ink-2)}
.bigkg{font-size:2.75rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.big{font-weight:800;line-height:1}
.table{width:100%;border-collapse:collapse;font-size:.9375rem}
.table th{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:700;padding:6px 6px 8px 0}
.table td{padding:12px 6px 12px 0;border-top:1px solid var(--surface-3);vertical-align:top}
.table tr[data-act]{cursor:pointer}
.scroll{overflow-x:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;background:var(--surface-3)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button.x{position:absolute;right:6px;bottom:6px;min-height:34px;padding:2px 12px;font-size:.8125rem;border-radius:99px;border:0;background:rgba(13,15,19,.85);color:var(--bad);font-weight:700}
.thumb button.open{position:absolute;inset:0;background:none;border:0;padding:0}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.94);display:grid;place-items:center;padding:var(--gutter)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(var(--gutter),env(safe-area-inset-left,0px));pointer-events:none}
.tabs-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:99px;background:rgba(35,40,44,.92);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 0;border:0;background:none;color:var(--ink-3);font-size:.6875rem;font-weight:700;border-radius:99px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ice);color:var(--ice-ink);padding:9px 16px;border-radius:99px;font-size:.875rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.err{background:var(--bad);color:#2E1010}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <header class="top"><div id="head"></div></header>
  <main id="app" aria-live="polite"></main>
  <p class="ver">Versie 7 &middot; <button class="link" data-act="logout">Uitloggen</button></p>
</div>
<nav class="tabs" aria-label="Hoofdmenu"><div class="tabs-in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>
<div id="lb"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var DAYS=['Zo','Ma','Di','Wo','Do','Vr','Za'];
var DAYS_LONG=['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
var MONTHS=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
var MONTHS_LONG=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function fmtShort(s){var d=parse(s);return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]}
function fmtDay(s){var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]}
function fmtLong(s){var d=parse(s);return DAYS_LONG[d.getDay()]+' '+d.getDate()+' '+MONTHS_LONG[d.getMonth()]}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?null:n}
function fmtNum(n,dec){return n==null?'':n.toLocaleString('nl-BE',{minimumFractionDigits:dec||0,maximumFractionDigits:dec==null?1:dec})}
function realToday(){return iso(new Date())}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
var TARGETS={kcal:'',protein:'',weight:'',weightDate:''};   // komen uit config/main in de database
var COLS=['weeks','plan','logs','body','food','inbox','config'];
var S={db:null,assets:null,cache:{},loaded:{},weekId:null,today:realToday(),day:null,tab:'today',proposal:null,bodyDate:null,foodDate:null,
  confirmDel:null,timeout:false,dirty:false,customOpen:false,outbox:[],known:{},online:true,stale:false};
COLS.forEach(function(c){S.cache[c]={}});
(function(){var o=ls('dst.today');if(o&&/^\d{4}-\d{2}-\d{2}$/.test(o))S.today=o;
  try{S.outbox=JSON.parse(ls('dst.outbox')||'[]')||[]}catch(e){S.outbox=[]}
  try{var c=JSON.parse(ls('dst.cache')||'null');if(c){COLS.forEach(function(k){if(c[k])S.cache[k]=c[k]});S.stale=true}}catch(e){}
  S.online=navigator.onLine!==false})();
function deepMerge(a,b){var o=Object.assign({},a||{});Object.keys(b).forEach(function(k){var v=b[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v});return o}
function persistOutbox(){ls('dst.outbox',JSON.stringify(S.outbox))}
function persistCache(){ls('dst.cache',JSON.stringify(S.cache))}
function save(col,id,patch){
  S.cache[col][id]=deepMerge(S.cache[col][id],patch);
  S.outbox.push({col:col,id:id,patch:patch,t:Date.now()});persistOutbox();persistCache();
  toast(S.online?'Bewaard':'Bewaard, wordt gesynchroniseerd zodra je verbinding hebt');
  setSync();flush();
}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
var flushing=false;
async function flush(){
  if(flushing||!S.db||!S.online)return;
  flushing=true;setSync();
  try{
    while(S.outbox.length){
      var it=S.outbox[0];
      var r=await withTimeout(S.db.rpc('merge_doc',{p_collection:it.col,p_id:it.id,p_patch:it.patch}),10000);
      if(r&&r.error){ if(r.error.code==='PGRST301'||r.error.code==='42501'||/JWT|permission/i.test(r.error.message||'')){S.authProblem=true} throw r.error }
      S.outbox.shift();persistOutbox();
    }
    S.authProblem=false;
  }catch(e){ /* blijft in de wachtrij, we proberen later opnieuw */ }
  flushing=false;setSync();
}
setInterval(function(){if(S.outbox.length)flush()},15000);
window.addEventListener('online',function(){S.online=true;setSync();flush()});
window.addEventListener('offline',function(){S.online=false;setSync()});
function setSync(){
  var n=S.outbox.length,el=$('#sync');if(!el)return;
  var cls='sync',txt='Gesynchroniseerd';
  if(!S.online){cls+=' off';txt='Geen verbinding'+(n?' ('+n+' wachten)':'')}
  else if(n){cls+=' wait';txt='Synchroniseren ('+n+')'}
  else if(S.authProblem){cls+=' off';txt='Opnieuw inloggen nodig ('+n+' wachten)'}
  else if(!S.db){cls+=' wait';txt='Verbinden...'}
  else if(S.stale&&!S.loaded.weeks){cls+=' wait';txt='Laatst bekende gegevens'}
  el.className=cls;el.innerHTML='<i></i>'+txt;
}
var tt;function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(function(){t.className='toast'},err?3500:1400)}
function weeksSorted(){return Object.keys(S.cache.weeks).map(function(id){return Object.assign({id:id},S.cache.weeks[id])}).sort(function(a,b){return a.start<b.start?-1:1})}
function curWeek(){
  var ws=weeksSorted();if(!ws.length)return null;
  if(S.weekId&&S.cache.weeks[S.weekId])return ws.filter(function(w){return w.id===S.weekId})[0];

  (p.custom||[]).forEach(function(c){base.push(Object.assign({},c,{src:'eigen'}))});
  return base.map(function(s){var d=moves[s.id]||s.day;return Object.assign({},s,{origDay:s.day,day:d,moved:d!==s.day,status:status[s.id]||''})})
    .sort(function(a,b){return a.day<b.day?-1:a.day>b.day?1:0});

function evalSlot(w,s,d,placed){
  if(isBlocked(w,d))return {ok:false};
  var why=[],pen=0,same=placed.filter(function(p){return p.day===d}),load=same.reduce(function(a,p){return a+(p.load||0)},0);
  if(load+(s.load||0)>5)return {ok:false};

  for(var i=0;i<placed.length;i++){var p=placed[i],gap=Math.abs(diffDays(d,p.day));
    if(has(s,'hardrun')&&has(p,'hardrun')&&gap<2)return {ok:false};

    if(has(s,'hardrun')&&has(p,'legheavy')&&diffDays(d,p.day)===1){pen+=4;why.push('dag na zware benen ('+p.title+')')}
    if(has(s,'legheavy')&&has(p,'hardrun')&&diffDays(p.day,d)===1){pen+=4;why.push('dag voor een harde run')}
    if(has(s,'legheavy')&&has(p,'longrun')&&diffDays(d,p.day)===1){pen+=3;why.push('dag na een lange run')}
    if(has(s,'shoulder')&&has(p,'shoulder')&&gap===2){pen+=1;why.push('schouders pas 2 dagen na '+p.title)}

  var days=weekDays(w),out=[];
  pend.forEach(function(s){
    var best=null;
    days.forEach(function(d){
      if(d<S.today)return;

      var r=evalSlot(w,s,d,placed);

    });
    if(best&&!(s.opt&&best.pen>7)){
      out.push({sid:s.id,title:s.title,from:s.day,to:best.d,why:best.why.length?best.why.join(' · '):'vrije dag'});
      placed.push(Object.assign({},s,{day:best.d}));

    }
  });

}

  S.needLogin=false;S.db=sb;S.assets=makeAssets(session.user.id);S.loaded.init=true;
  setSync();render();
  try{ onRows(await loadAll()) }catch(e){ console.error('laden',e&&e.message||e); if(S.online)toast('Laden mislukt, laatst bekende gegevens getoond',true) }
  if(S.chan){try{sb.removeChannel(S.chan)}catch(e){}}
  S.chan=sb.channel('docs-sync').on('postgres_changes',{event:'*',schema:'public',table:'docs'},onChange).subscribe();
}
window.addEventListener('online',function(){if(S.db){loadAll().then(onRows).catch(function(){})}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.db&&S.online){loadAll().then(onRows).catch(function(){})}});
function boot(){
  render();
  if(!window.supabase||!CFG.url||!CFG.key){S.loaded.init=true;render();return}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='SIGNED_IN'&&session&&!S.db){startSession(session)}
    else if(ev==='SIGNED_OUT'&&!S.loggingOut){ if(S.online){S.needLogin=true;S.db=null;render()} }
    else if(ev==='TOKEN_REFRESHED'&&session){S.assets=makeAssets(session.user.id);flush()}
  });
  sb.auth.getSession().then(function(r){
    var session=r&&r.data&&r.data.session;
    if(session){startSession(session)}else{S.loaded.init=true;S.needLogin=true;render()}
  }).catch(function(){S.loaded.init=true;S.needLogin=true;render()});
}
document.addEventListener('click',function(ev){var el=ev.target.closest&&ev.target.closest('[data-act="login"],[data-act="signup"]');if(!el)return;doLogin(el.getAttribute('data-act')==='signup')});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
boot();
})();
</script>
